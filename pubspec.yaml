name: salud_dental_clinic_management
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  dartz: ^0.10.1
  equatable: ^2.0.8
  supabase_flutter: ^2.12.2
  get_it: ^9.2.1
  flutter_bloc: ^9.0.0
  table_calendar: ^3.1.0
  path_drawing: ^1.0.1
  file_picker: ^8.1.4
  image: ^4.3.0
  fl_chart: ^1.2.0
  connectivity_plus: ^6.1.0
  printing: ^5.14.3
  pdf: ^3.12.0
  image_picker: ^1.2.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#0284C7"
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png