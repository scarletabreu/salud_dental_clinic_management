<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestión de clínica dental">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Salud Dental">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Salud Dental</title>
  <link rel="manifest" href="manifest.json">

  <!--
    SD-132. Aquí había un <script> síncrono al bundle de passkeys de Corbado,
    servido desde github.com. Al no llevar `async` ni `defer`, el navegador
    detenía el parseo del documento hasta descargarlo y ejecutarlo: en el
    <head>, antes de que Flutter empezara siquiera a cargar. Sobre una conexión
    de clínica eso son segundos de pantalla en blanco, y el fallo del host
    dejaba la app sin arrancar.

    Se retira porque no se usa: `passkeys_platform_interface` entra como
    dependencia transitiva de supabase_flutter, pero la autenticación real de
    esta app es `signInWithPassword`. Si algún día se adoptan passkeys en web,
    hay que volver a añadirlo *con* `defer` y desde un origen propio, no desde
    una URL de releases de GitHub.

    Precalentar la conexión a Supabase sí vale la pena: el primer arranque
    resuelve DNS y negocia TLS mientras el motor de Flutter todavía se carga.
  -->
  <link rel="preconnect" href="https://xcuvywvltttephakzmwu.supabase.co" crossorigin>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
